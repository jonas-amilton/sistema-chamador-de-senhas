name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: queue_test
          MYSQL_USER: queue_user
          MYSQL_PASSWORD: queue_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uqueue_user -pqueue_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:h5GQ2XU4CRhXa8L3i0cKXow6qz+Othv3y7fV8nF0J5A=
      APP_URL: http://127.0.0.1:8010
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: queue_test
      DB_USERNAME: queue_user
      DB_PASSWORD: queue_password
      BROADCAST_CONNECTION: 'null'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: database

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, mbstring, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Validate Composer
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Backend tests on SQLite
        run: php artisan test --exclude-group=mysql-integration
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SESSION_DRIVER: array

      - name: MySQL concurrency tests
        run: php artisan test tests/Integration/MySql --group=mysql-integration
        env:
          RUN_MYSQL_INTEGRATION: 'true'

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHP static analysis
        run: composer types:check

      - name: Frontend lint
        run: npm run lint:check

      - name: Frontend format
        run: npm run format:check

      - name: TypeScript
        run: npm run types:check

      - name: Frontend tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
